<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 Fun Friday - Multiplayer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #a29bfe, #fd79a8, #ffeaa7, #55efc4);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            margin-bottom: 10px;
        }

        @keyframes gradientShift { 
            0%, 100% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            font-weight: 300;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            backdrop-filter: blur(14px);
            padding: 30px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
            margin-bottom: 20px;
        }

        .card h2 {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group button {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: rgba(162, 155, 254, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn {
            cursor: pointer;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #55efc4, #00b894);
            color: #1a1a2e;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(85, 239, 196, 0.4);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            gap: 10px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .error {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }

        .success {
            background: rgba(85, 239, 196, 0.15);
            border: 1px solid rgba(85, 239, 196, 0.3);
            color: #55efc4;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }

        .room-code-display {
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed rgba(255, 210, 0, 0.4);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin: 12px 0;
        }

        .room-code-display .label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .room-code-display .code {
            font-size: 2rem;
            font-weight: 900;
            color: #ffd200;
            font-family: 'Courier New', monospace;
            letter-spacing: 8px;
            word-break: break-all;
        }

        .copy-btn {
            background: rgba(255, 210, 0, 0.2);
            border: 1px solid rgba(255, 210, 0, 0.5) !important;
            color: #ffd200;
            padding: 8px 16px;
            font-size: 0.8rem;
            margin-top: 10px;
            width: auto;
            display: inline-flex;
            cursor: pointer;
            border-radius: 10px;
        }

        .copy-btn:hover {
            background: rgba(255, 210, 0, 0.3);
        }

        .hidden {
            display: none;
        }

        .info-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            text-align: center;
            margin-top: 12px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }
            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">🎉 Fun Friday</h1>
            <p>Multiplayer Game Room</p>
        </div>

        <div id="createRoomCard" class="card">
            <h2>🎲 Create Room</h2>
            <div class="error" id="createError"></div>

            <button class="btn btn-secondary" onclick="createRoom()">
                ✨ Create & Enter Room
            </button>

            <p class="info-text">You'll enter as the Host and can manage players & games</p>
        </div>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="card">
            <h2>👥 Join Room</h2>
            <div class="error" id="joinError"></div>
            
            <div class="form-group">
                <label for="roomCodeInput">Room Code</label>
                <input type="text" id="roomCodeInput" placeholder="Enter 6-letter code..." 
                       onkeydown="if(event.key==='Enter')joinRoom()" maxlength="6" style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label for="playerNameInput">Your Name</label>
                <input type="text" id="playerNameInput" placeholder="Enter your name..." maxlength="30"
                       onkeydown="if(event.key==='Enter')joinRoom()">
            </div>

            <button class="btn btn-primary" onclick="joinRoom()">
                🚀 Join Game
            </button>

            <p class="info-text">Ask your host for the room code</p>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        let currentRoomCode = null;

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        async function createRoom() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Creating...';
            document.getElementById('createError').style.display = 'none';

            try {
                const response = await fetch('/api/room/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await response.json();

                if (data.success) {
                    currentRoomCode = data.room_code;
                    window.location.href = '/game?code=' + currentRoomCode + '&name=Host&host=1';
                } else {
                    document.getElementById('createError').textContent = data.error || 'Failed to create room';
                    document.getElementById('createError').style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '✨ Create & Enter Room';
                }
            } catch (err) {
                document.getElementById('createError').textContent = 'Error: ' + err.message;
                document.getElementById('createError').style.display = 'block';
                btn.disabled = false;
                btn.textContent = '✨ Create & Enter Room';
            }
        }



        async function joinRoom() {
            const roomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            const playerName = document.getElementById('playerNameInput').value.trim();

            if (!roomCode || roomCode.length < 4 || roomCode.length > 8) {
                document.getElementById('joinError').textContent = '⚠️ Enter a valid room code';
                document.getElementById('joinError').style.display = 'block';
                return;
            }

            if (!playerName) {
                document.getElementById('joinError').textContent = '⚠️ Enter your name';
                document.getElementById('joinError').style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`/api/room/${roomCode}/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player_name: playerName })
                });
                const data = await response.json();

                if (data.success) {
                    window.location.href = `/game?code=${roomCode}&name=${encodeURIComponent(playerName)}`;
                } else {
                    document.getElementById('joinError').textContent = data.error || 'Failed to join room';
                    document.getElementById('joinError').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('joinError').textContent = 'Error: ' + err.message;
                document.getElementById('joinError').style.display = 'block';
            }
        }
    </script>
</body>
</html>
